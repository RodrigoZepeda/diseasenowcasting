url: https://rodrigozepeda.github.io/diseasenowcasting/

home:
  title: diseasenowcasting — Bayesian Epidemic Nowcasting
  description: >
    Nowcast time series of epidemiological cases using a censored-regression
    approach with RTMB.

template:
  bootstrap: 5
  # Show pkgdown's light/dark theme control. The stylesheet is discovered
  # automatically from pkgdown/extra.css.
  light-switch: true
  math-rendering: katex
  bslib:
    bootswatch: flatly
    primary: "#5F7E62"      # dark sage green
    secondary: "#B85348"    # desaturated red
    success: "#5F7E62"
    danger: "#B85348"       # desaturated red
    dark: "#262626"         # charcoal

navbar:
  structure:
    left:  [get_started, reference, articles, news]
    right: [search, github, lightswitch]

  components:
    get_started:
      text: Get started
      href: articles/introduction.html
    github:
      icon: fab fa-github
      href: https://github.com/RodrigoZepeda/diseasenowcasting
      aria-label: GitHub

articles:
  - title: Get started
    contents:
      - introduction
  
  - title: Methodology
    contents:
      - articles/Mathematics
      - Understanding_Priors
      - articles/Handling_Outlier_Delays_with_Censoring
      - articles/Revision_processes

  - title: Applications
    contents:
      - Nowcasting_at_the_start_of_an_Epidemic
      - Custom_delays_and_processes

  - title: Miscellaneous
    contents:
      - articles/LLM_Usage
      - articles/Benchmark
